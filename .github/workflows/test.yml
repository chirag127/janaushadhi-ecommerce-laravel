name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sqlite3, pdo_sqlite, mbstring, xml, curl, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Prepare storage + cache dirs
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/{cache,sessions,views} storage/logs
          chmod -R 777 storage bootstrap/cache

      - name: Generate app key
        run: php artisan key:generate

      - name: Discover packages
        run: php artisan package:discover --ansi

      - name: Run tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SHARED_DB_CONNECTION: sqlite
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Verify Laravel asset entry points
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const manifest = JSON.parse(fs.readFileSync("public/build/manifest.json", "utf8")); for (const entry of ["resources/css/app.css", "resources/js/app.js"]) { assert.ok(manifest[entry]?.isEntry, `Missing entry: ${entry}`); assert.ok(fs.existsSync(`public/build/${manifest[entry].file}`), `Missing output: ${entry}`); }'
