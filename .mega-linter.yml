# MegaLinter configuration — disable noisy checkers
DISABLE_ERRORS: true
DISABLE_LINTERS:
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - SPELL_CSPELL
  - SPELL_LYCHEE
  - REPOSITORY_CHECKOV
  - REPOSITORY_GRYPE
  - HTML_DJLINT
  - HTML_HTMLHINT
  - PHP_PHPSTAN
  - PHP_PSALM
  - REPOSITORY_KICS
  - REPOSITORY_DEVSKIM
  - COPYPASTE_JSCPD
  - REPOSITORY_GITLEAKS
  - REPOSITORY_TRIVY
APPLY_FIXES: all
FORMATTERS_DISABLE_ERRORS: true
