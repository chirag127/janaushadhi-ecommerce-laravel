# MegaLinter GitHub Action configuration
# Auto-fixes formatting and linting issues on every push and PR
name: MegaLinter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Use cupcake flavor (most common languages, ~700MB vs 2GB full)
  MEGALINTER_FLAVOR: all
  # Auto-fix all fixable issues
  APPLY_FIXES: all
  APPLY_FIXES_EVENT: push
  APPLY_FIXES_MODE: commit
  # Don't fail build on formatter issues (only real errors fail)
  FORMATTERS_DISABLE_ERRORS: true
  # GitHub token for auto-fix commits
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push applied fixes
        if: steps.ml.outputs.has_updated_sources == 1
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: apply linters auto-fixes"
          commit_user_name: megalinter-bot
          commit_user_email: megalinter-bot@users.noreply.github.com
          file_pattern: "!.github/workflows/**"

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 7
